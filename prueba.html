<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Estética Canina Copiapó</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            padding: 20px;
        }
        .contenedor-galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        /* Esto asegura que las fotos no se vean gigantes en el computador */
        .instagram-media {
            max-width: 400px; 
            width: 100%;
            min-width: 300px;
        }
    </style>
</head>
<body>

    <h1>Nuestros últimos trabajos 🐾</h1>
    <p>Síguenos en <a href="https://www.instagram.com/esteticacaninacopiapo/?hl=es" target="_blank">@esteticacaninacopiapo</a></p>

    <div class="contenedor-galeria">
        
        <!-- FOTO 1: Reemplaza el enlace data-instgrm-permalink por una foto tuya -->
        <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/C-RJmN6Oq5p/" data-instgrm-version="14"></blockquote>
        
        <!-- FOTO 2: Puedes agregar todas las cajas que quieras -->
        <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/C9_AABBB123/" data-instgrm-version="14"></blockquote>

    </div>

    <!-- MUY IMPORTANTE: Este script de Instagram es el que hace la magia de mostrar la foto y no solo un enlace -->

</body>
